[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ai-github-repository-agent"
version = "0.1.0"
description = "Evidence-grounded AI assistance for understanding GitHub repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "chromadb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "langchain-core>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "pathspec>=0.12,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
ai = [
    "langchain-anthropic>=1.0,<2.0",
    "langchain-huggingface>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "sentence-transformers>=3.3,<6.0",
]
parsers = ["tree-sitter-language-pack>=1.0,<2.0"]
ui = ["streamlit>=1.40,<2.0"]
github-mcp = ["mcp>=1.26,<2.0"]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dev_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
